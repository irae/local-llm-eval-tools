<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>issue-simulator-bench report</title>

<style>
    :root {
        --ground: #f4f6f8;
        --surface: #ffffff;
        --surface-alt: #eceff3;
        --ink: #161b22;
        --ink-soft: #4a5563;
        --ink-faint: #78838f;
        --rule: #d7dde4;
        --brand: #20304f;
        --dim-opacity: 0.5;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
            --ground: #12161c;
            --surface: #191f27;
            --surface-alt: #212933;
            --ink: #e4e9ef;
            --ink-soft: #a6b1bf;
            --ink-faint: #7b8695;
            --rule: #2c3541;
            --brand: #9db3d8;
        }
    }
    :root[data-theme='dark'] {
        --ground: #12161c;
        --surface: #191f27;
        --surface-alt: #212933;
        --ink: #e4e9ef;
        --ink-soft: #a6b1bf;
        --ink-faint: #7b8695;
        --rule: #2c3541;
        --brand: #9db3d8;
    }
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 24px 32px 64px;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
        font-size: 20px;
        margin: 0 0 4px;
    }
    h2 {
        font-size: 16px;
        margin: 32px 0 8px;
        color: var(--brand);
    }
    .meta {
        color: var(--ink-faint);
        font-size: 13px;
        margin: 0 0 16px;
    }
    .nav {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
    }
    p.nav {
        margin: 0 0 16px;
    }
    .nav a {
        color: var(--brand);
        text-decoration: none;
    }
    .nav a:hover {
        text-decoration: underline;
    }
    .scroller {
        overflow-x: auto;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: var(--surface);
    }
    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 480px;
        font-size: 14px;
    }
    th,
    td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        white-space: nowrap;
    }
    th {
        background: var(--surface-alt);
        color: var(--ink-soft);
        font-weight: 600;
        position: sticky;
        top: 0;
    }
    td.num,
    th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
    }
    tr.dim {
        opacity: var(--dim-opacity);
    }
    tr:last-child td {
        border-bottom: none;
    }
    details {
        margin: 8px 0;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: var(--surface);
        padding: 6px 10px;
    }
    details summary {
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 13px;
    }
    details pre {
        overflow-x: auto;
        font-size: 12px;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
    }
</style>

<h1>issue-simulator-bench report</h1>
<p class="meta">Generated {{GENERATED}}</p>
{{NAV}}

<div id="scoreboard">
{{SCOREBOARD}}
</div>

<div id="cost">
{{COST}}
</div>

<div id="plan">
{{PLAN}}
</div>

<div id="server-logs">
{{SERVERLOGS}}
</div>
